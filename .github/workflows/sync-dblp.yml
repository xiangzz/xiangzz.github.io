name: Sync DBLP Publications

# 定时同步 DBLP 论文数据，生成 publications.json
on:
  schedule:
    # 每周一 UTC 02:00 执行（北京时间 10:00）
    - cron: '0 2 * * 1'
  workflow_dispatch: {} # 支持在 GitHub 页面手动触发

# 允许 Action 提交 publications.json 到仓库
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 同步 DBLP 论文数据
        run: node scripts/sync-dblp.js

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publications.json
          if git diff --cached --quiet; then
            echo "论文数据无变化，跳过提交"
          else
            git commit -m "chore: 自动同步 DBLP 论文数据"
            git push
          fi
